[package]
name = "glint-core"
description = "Glint's engine: file system, search, archives, media, devices... (moved from src-tauri, Tauri replaced by host)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "glint_core"

[dependencies]

serde = { version = "1.0", features = ["derive"] }
# JSON objects keep their keys' order (a package.json's scripts as written, ExifTool's tags as it lists them), as
# in the app: GPUI turns this on in Glint.exe, and the Tauri build had it too, so tests see what ships.
serde_json = { version = "1.0", features = ["preserve_order"] }
notify = "8"
shadui-index = { path = "../../src-tauri/index" }
# The File X-Ray's checksums: RustCrypto's SHA-256 (with the CPU's SHA instructions where it has them)
# and crc32fast, both already in the build through Tauri and flate2, and BLAKE3, which the duplicate
# finder hashes content with too (several times SHA-256's speed, with SIMD).
sha2 = "0.10"
rayon = "1.12"
# Remote connections' URLs (remote/), as reqwest already has them.
percent-encoding = "2"
url = "2"
# SFTP's runs waited on off the async threads (remote/sftp.rs), as Tauri's tokio already has it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "fs", "io-util", "net"] }
crc32fast = "1.5"
blake3 = "1.8"
# Paste as file: a picture on the clipboard as a PNG (already in the build through Tauri).
png = "0.18"
# Find duplicates' Clone on ReFS and Dev Drives: block clones (FSCTL_DUPLICATE_EXTENTS_TO_FILE), over the
# windows crate already in the build.
reflink-copy = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Markdown previews: GitHub's flavor (tables, task lists, footnotes), its HTML kept to an allowlist by
# the preview.
comrak = { version = "0.57", default-features = false }
# JSON, YAML and TOML as a tree: jaq's readers and JSON writer, without its filters (jq filters run in
# the jaq program, installed on demand: compiled in, they'd add 4 MB). Run in a worker process (jq.rs).
jaq-json = { version = "2", default-features = false, features = ["std"] }
jaq-fmts = { version = "0.1", default-features = false, features = ["yaml", "toml"] }
# Spreadsheets without Office (Excel's .xlsx/.xlsb/.xls, OpenDocument's .ods) and Parquet files, as
# tables. Parquet without Arrow, and without Brotli (rare in Parquet, and 1.2 MB on its own); its
# Zstandard is the C library's (0.4 MB).
calamine = "0.38"
parquet = { version = "60", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "zstd"] }
# SQL in the preview: SQLite itself (built in, 1.7 MB), over a database opened read-only or a table file
# loaded into memory (sql.rs); `hooks` for its authorizer and progress handler.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks"] }
# Photo, video and music details: EXIF and video tracks (nom-exif, pure Rust, fuzzed) and audio tags
# (lofty); chrono reads a camera's local time as this PC's, base64 makes a cover a data: URL (both are
# in the build through them).
nom-exif = "3.8"
lofty = "0.25"
# A picture's size in pixels from its header, when it has no EXIF to say it (PNG, GIF, BMP, WebP…), for
# width: and height: filters. Pure Rust, no dependencies.
imagesize = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# The calculator in Ctrl+K (= 3 ft to cm): fend, a units-aware calculator in pure Rust with no
# dependencies (1.2 MB; numbat, planned first, was 3.3 MB).
fend-core = "1.5"
# Meaning search (meaning.rs): BERT's normalizer and pre-tokenizer, by Unicode's decompositions and
# general categories; both already in the build through pdf-extract.
unicode-normalization = "0.1"
unicode-properties = "0.1"
# Documents search (doctext.rs): a PDF's text by pdf-extract (pure Rust, over lopdf), in a worker
# process; Office's, OpenDocument's and EPUB's XML by quick-xml and the pattern by the regex crate,
# both in the build already.
pdf-extract = "0.12"
quick-xml = "0.42"
regex = "1"
# Old text files in their own encodings (Arabic Windows-1256, Cyrillic, Chinese…): Firefox's detector
# (chardetng, pure Rust) guesses which, encoding_rs (in the build already) decodes it.
chardetng = "1.0"
# Microsoft's allocator for Glint (the instant search service keeps Windows' own until it's measured in
# place): listing and sorting make and free many small strings. Kept for what `npm run bench`
# measured (NEXT_RELEASE.md, H19).
mimalloc = { version = "0.1.52", default-features = false }
encoding_rs = "0.8"
# Zip and 7z archives, read like folders. Both pure Rust: zip-rs (the maintained successor of the
# original zip crate, fuzzed) with every common method, and passwords (ZipCrypto, and AES through
# RustCrypto's aes, hmac, pbkdf2 and sha1), and sevenz-rust2 (the maintained fork of sevenz-rust,
# hardened against crafted headers), AES too. zip-rs's and sevenz-rust2's own Zstandard is C, so
# Zstandard entries and 7z blocks are decoded with ruzstd, a pure Rust decoder; sevenz-rust2's LZ4 is
# lz4_flex, pure Rust.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd", "legacy-zip", "aes-crypto"] }
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "ppmd", "deflate", "lz4", "aes256", "compress"] }
ruzstd = "0.9.1"
# Search inside files instantly: the content index (content.rs).
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
# Photo search (photos.rs): ONNX Runtime, its DLL downloaded when photo search is turned on, never bundled.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
# Devices (devices.rs): QUIC between Glint on your PCs, dialed by key, through NATs (ring, as rustls already uses).
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
# age encryption (Encrypt… on a file's menu, vault.rs): the format of age and rage, in Rust.
age = { version = "0.12.1", default-features = false }
# Nearby (localsend.rs): the LocalSend protocol's small HTTP server and its multicast, with what Glint has already.
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
socket2 = "0.6"
# Compress to tar.zst (with ruzstd's encoder).
tar = { version = "0.4", default-features = false }
# Tar and single compressed files (.gz, .xz, .bz2, .lz4), all pure Rust: the first three are already
# in the build through zip-rs (zlib-rs, libbz2-rs-sys, lzma-rust2); lz4_flex is new.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
lz4_flex = "0.14"
# Cabinets' LZX blocks (Glint reads cabinets itself; MSZIP is flate2's). Pure Rust, no dependencies.
lzxd = "0.2.7"
# Windows Installer packages' tables and streams: its compound-file reader (cfb) is in the build already.
msi = "0.10"
# RAR archives: RARLAB's UnRAR (C++, built with the MSVC compiler), only ever in test mode, its data
# handed to a callback (it never writes files). The UnRAR license ships in THIRD_PARTY_LICENSES.md.
unrar_sys = "0.5.8"
# Git status in folders: gitoxide, pure Rust, reading the repository only (no network, credentials or
# worktree changes), so it works without git installed. Its zlib is zlib-rs, already in the build;
# imara-diff comes with its blob diffs. Status is most of its 3.6 MB in Glint.exe; `parallel` keeps it
# interruptible (the deadline and Stop).
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "status", "parallel"] }
# The terminal pane's shells, in Windows' pseudo console (ConPTY), from WezTerm.
portable-pty = "0.9"

[dev-dependencies]
# Tests write their own cabinets (stored and MSZIP).
cab = "0.6"
# Tests write their own 7z archives (Zstandard ones with the C library, in tests only), tars (long
# names, PAX headers, links) and .xz files.
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "ppmd", "deflate", "lz4", "aes256", "zstd", "compress"] }
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Without the default `zip` feature: it only unpacks Tauri v1-style .zip updates, and updates here
# are the NSIS setup.exe itself.

# Downloading the optional tools winget doesn't have (tools.rs): the HTTP client and TLS the updater
# already brings (rustls with ring), so they add next to nothing.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]

# Which Windows 11 materials the window can have (appearance.rs); in the build already through Tauri.
windows-version = "0.1"
# What windows' #[implement] expands to (the file engine's progress sink, for Undo); already in the build.
windows-core = "0.62"
windows = { version = "0.62", features = [
    # The Microsoft Store copy's startup task, for Start with Windows (quick.rs).
    "ApplicationModel",
    # A PDF's first page as a thumbnail, by Windows' own PDF renderer (thumbs.rs).
    "Data_Pdf",
    "Foundation_Collections",
    "Graphics_Imaging",
    # Text in pictures, by Windows' own OCR (ocr.rs).
    "Media_Ocr",
    "Storage_Streams",
    # Windows' accent color and its shades (appearance.rs).
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    # A video's frames for scrubbing its tile in the grid (scrub.rs).
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Gdi",
    # Photo search reads pictures with Windows' own codecs (photos.rs).
    "Win32_Graphics_Imaging",
    # Files On-Demand for remotes (ondemand.rs).
    "Win32_Storage_CloudFilters",
    "Win32_System_CorrelationVector",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # A server's shares, listed at \\server (fsx.rs): NetShareEnum's answer is freed with NetApiBufferFree.
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    # Whether Windows lets other devices reach a share on this network: its firewall's rules for dufs,
    # and the kind of network the share's address is on (lan.rs).
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    # Whether this copy runs from an MSIX package, the Microsoft Store's (lib.rs).
    "Win32_Storage_Packaging_Appx",
    # Mounting a disc image without File Explorer's window (shell.rs).
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    # Cloud files' (OneDrive's) states, asked of Windows where it has them (fsx.rs).
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    # Tauri switched this on for us (remote/sftp.rs).
    "Win32_System_SystemInformation",
    # Files dragged onto the window: which keys are held (dragdrop.rs).
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
