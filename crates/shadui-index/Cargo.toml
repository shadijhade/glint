[package]
name = "shadui-index"
version.workspace = true
license.workspace = true
description = "NTFS MFT + USN journal index for Glint: instant name search, folder sizes and disk-usage maps"
edition = "2021"
publish = false

[lib]
name = "shadui_index"

[[bin]]
name = "shadui-index"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2"
rayon = "1"
# Checking a newer service against the update key before it replaces this one (update.rs).
base64 = "0.22"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # Whether the Microsoft Store package that installed the service is still installed (service.rs).
    "ApplicationModel",
    "Management_Deployment",
    # Shadow copies' devices, found by name without an administrator (shadow.rs).
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vss",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
