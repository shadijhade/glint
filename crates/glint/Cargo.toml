[package]
name = "glint"
description = "Glint.exe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Glint"
path = "src/main.rs"

[dependencies]
glint-ui = { path = "../glint-ui" }
glint-core = { path = "../glint-core" }
# Microsoft's allocator, Glint.exe's global allocator (main.rs): listing and sorting make and free many small
# strings. Kept for what `npm run bench` measured in 0.10 (H19); the instant search service keeps Windows' own.
mimalloc = { version = "0.1.52", default-features = false }

[build-dependencies]
# Glint.exe's icon, version info and manifest (the same crate GPUI uses for its manifest).
embed-resource = "3"
