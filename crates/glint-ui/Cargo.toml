[package]
name = "glint-ui"
description = "Glint's interface on GPUI (see docs/gpui/UI-SKELETON.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "glint_ui"

# One feature per module being built in a wave, so each agent builds the skeleton plus its own module while
# others are mid-edit (`--no-default-features --features <yours>`). Once the coordinator has integrated a
# wave its features go and the modules are always built. (Wave 3's went with its integration.)
[features]
default = []

[dependencies]
# syntect: syntax highlighting for the text and code previews (pure Rust: fancy-regex, two-face's grammars).
gpui-kit = { version = "=0.9.1", features = ["syntect"] }
glint-model = { path = "../glint-model" }
glint-core = { path = "../glint-core" }
async-channel = "2"
# The `implement` macro (dragdrop.rs) names this crate.
windows-core = "0.62"
raw-window-handle = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
# Already in the build (GPUI, glint-core, usvg): pixels straight into a RenderImage (3D models, PDF pages), and the
# zip and XML inside EPUB, Word, 3MF files.
image = { version = "0.25", default-features = false }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.20"
# Wave 11. Mermaid without ELK (EPL-2.0: never the default or `complete-svg-elk` features); RaTeX embeds KaTeX's
# fonts (SIL OFL 1.1, their notice ships with the app); Typst reads the system fonts only (no bundled fonts, no
# package downloads, no OpenSSL).
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
layout-rs = { version = "=0.1.3" }
ratex-parser = { version = "=0.1.15" }
ratex-layout = { version = "=0.1.15" }
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
alacritty_terminal = { version = "=0.26.0" }
typst = { version = "=0.15.1" }
typst-pdf = { version = "=0.15.1" }
typst-render = { version = "=0.15.1" }
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts"] }
markdown = { version = "1.0.0" }
# Wave 12, already in the build (the index service's self-update, glint-core's downloads): the updater checks the
# installer's minisign signature with the key the releases are signed with, and downloads over rustls.
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "stream"] }
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "UI",
    "UI_ViewManagement",
    "Foundation",
    "Win32_UI_HiDpi",
    "Win32_Globalization",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    # Wave 3's platform modules (launch, tray, dragdrop, window_state), listed here rather than borrowed from
    # glint-core through feature unification.
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "ApplicationModel",
    # The batch rename dialog's local dates.
    "Win32_System_Time",
    # Wave 10's native previews: PDF pages (Windows.Data.Pdf), video and audio (Media Foundation's media engine,
    # frames copied through a Direct3D 11 texture), WinRT buffers. glint-core already builds most of these.
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "Foundation_Collections",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
] }

# Headless window tests (gpui-kit's test module) need gpui-kit's test-support feature. It is a dev-dependency
# only: the app itself is built without it. NOTE(coordinator): the one Cargo.toml change beyond windows features.
[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
