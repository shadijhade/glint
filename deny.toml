# cargo-deny's checks of the crates Glint is built from (docs/releasing.md):
#   cargo deny check
# (from the repository root: the workspace of Glint.exe and the instant search service, vendor/ aside)
# known vulnerabilities and unmaintained crates (RustSec's advisory database), licenses that can ship
# in an MIT-licensed app, and crates only from crates.io. (Fonts, icons and data a crate embeds under licenses of
# its own, which cargo-deny can't see, are in scripts/lib/embedded-notices.mjs.)

[graph]
# The one build that ships.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates are reported for Glint's own dependencies, not for what those pull in.
unmaintained = "workspace"
# Advisories with no fixed version Glint can reach yet (the maintainer's decision for v0.10.0, 2026-11-11). Take
# each out once the crate that pins the old version ships a fix.
ignore = [
    # crypto-bigint 0.5.5: timing variability in operations meant to be constant-time. It comes only through
    # age 0.12's P-256 support (elliptic-curve 0.13 needs crypto-bigint 0.5; the fix is 0.7.6). Using it means
    # timing Encrypt and Decrypt on the same PC, with a P-256 recipient.
    { id = "RUSTSEC-2026-0387", reason = "only through age 0.12's P-256 path; no age release with elliptic-curve 0.14 yet" },
    # quick-xml 0.38: quadratic time on duplicate attribute names, and unbounded namespace declarations, both on
    # crafted XML. It comes only through Typst's citationberg (^0.38), which parses citation styles in Typst
    # documents shown in the preview: a crafted file can make that preview slow or memory-hungry, nothing more.
    { id = "RUSTSEC-2026-0194", reason = "only through Typst's citationberg 0.7 (quick-xml ^0.38); denial of service on crafted citation styles" },
    { id = "RUSTSEC-2026-0195", reason = "only through Typst's citationberg 0.7 (quick-xml ^0.38); denial of service on crafted citation styles" },
]

[licenses]
# A crate under several licenses (MIT OR Apache-2.0) needs one of them here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    # webpki-roots (Mozilla's root certificates, through iroh for Devices): a data licence that asks
    # for its text to go with it, which THIRD_PARTY_CRATES.md carries.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # Its source has to stay available: crates.io keeps it, and THIRD_PARTY_CRATES.md says where.
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# Glint's own crates (MIT, like the app).
private = { ignore = true }

[bans]
# Two versions of a crate (windows-sys has several) cost size, not correctness.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
