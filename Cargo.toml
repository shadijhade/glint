# Glint on GPUI (local branch gpui-migration; never pushed until the migration is done).
# The old app (src-tauri) keeps its own workspace and isn't a member.
[workspace]
resolver = "2"
members = ["crates/glint-model", "crates/glint-core", "crates/glint-ui", "crates/glint", "crates/shadui-index"]
exclude = ["src-tauri", "vendor"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization"] }

# GPUI with the right-to-left fix (docs/gpui/rtl-fix.patch), vendored from crates.io and patched.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.12" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.12" }
gpui-base = { path = "vendor/gpui-base-0.9.1" }

# Dependencies (GPUI, glint-core's tree) are built without debug info in debug builds: with it, every glint-ui
# test binary linked a PDB of about 1 GB, one per feature combination, and a wave of agents filled the disk.
[profile.dev.package."*"]
debug = false

# Glint's own crates keep line tables (file:line in panics and backtraces) but not full debug info: a wave of
# agents still filled 45 GB with full-debug test binaries and their incremental caches.
[profile.dev]
debug = "line-tables-only"

# The instant search service (moved here from src-tauri/index) was built with src-tauri's release profile (fat LTO,
# one codegen unit). LTO is a whole-profile setting and isn't switched on here (it would slow every Glint build);
# the service gets one codegen unit, which per-package settings can do.
[profile.release.package.shadui-index]
codegen-units = 1
