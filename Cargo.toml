# Glint on GPUI (local branch gpui-migration; never pushed until the migration is done).
# The old app (src-tauri) keeps its own workspace and isn't a member.
[workspace]
resolver = "2"
members = ["crates/glint-model", "crates/glint-core", "crates/glint-ui", "crates/glint"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization"] }

# GPUI with the right-to-left fix (docs/gpui/rtl-fix.patch), vendored from crates.io and patched.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.12" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.12" }
gpui-base = { path = "vendor/gpui-base-0.9.1" }
