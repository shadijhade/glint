# Glint: a file explorer for Windows, in Rust on GPUI.
[workspace]
resolver = "2"
members = ["crates/glint-model", "crates/glint-core", "crates/glint-ui", "crates/glint", "crates/shadui-index"]
exclude = ["vendor"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization"] }

# GPUI with the right-to-left fix (docs/gpui/rtl-fix.patch), vendored from crates.io and patched.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.12" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows-0.3.12" }
gpui-base = { path = "vendor/gpui-base-0.9.1" }
# The kit's styled controls, for the motion and feel changes listed in docs/gpui/VENDOR.md.
gpui-component = { path = "vendor/gpui-component-0.9.1" }

# Dependencies (GPUI, glint-core's tree) are built without debug info in debug builds: with it, every glint-ui
# test binary linked a PDB of about 1 GB, one per feature combination, and a wave of agents filled the disk.
[profile.dev.package."*"]
debug = false

# Glint's own crates keep line tables (file:line in panics and backtraces) but not full debug info: a wave of
# agents still filled 45 GB with full-debug test binaries and their incremental caches.
[profile.dev]
debug = "line-tables-only"

# Releases: thin link-time optimisation across crates (the Tauri builds used fat LTO; thin keeps most of the gain
# for an app this size without the long single-threaded link). Debug builds and tests are unaffected.
[profile.release]
lto = "thin"

# The instant search service was built with one codegen unit in the Tauri app's profile; it keeps that.
[profile.release.package.shadui-index]
codegen-units = 1

# Crates only rare actions reach (a database, Parquet or workbook preview, math, the calculator, a photo's or song's
# tags, downloads, an installer's contents, encryption, a 7z's headers) are compiled for size: measured in 0.12, the
# exe is smaller and nothing on a path the window waits on runs their code.
[profile.release.package.libsqlite3-sys]
opt-level = "s"
[profile.release.package.rusqlite]
opt-level = "s"
[profile.release.package.lofty]
opt-level = "s"
[profile.release.package.parquet]
opt-level = "s"
[profile.release.package.ratex-parser]
opt-level = "s"
[profile.release.package.ratex-layout]
opt-level = "s"
[profile.release.package.ratex-svg]
opt-level = "s"
[profile.release.package.ratex-font-loader]
opt-level = "s"
[profile.release.package.fend-core]
opt-level = "s"
[profile.release.package.nom-exif]
opt-level = "s"
[profile.release.package.reqwest]
opt-level = "s"
[profile.release.package.hyper]
opt-level = "s"
[profile.release.package.hyper-util]
opt-level = "s"
[profile.release.package.markdown]
opt-level = "s"
[profile.release.package.calamine]
opt-level = "s"
[profile.release.package.layout-rs]
opt-level = "s"
[profile.release.package.sevenz-rust2]
opt-level = "s"
[profile.release.package.msi]
opt-level = "s"
[profile.release.package.age]
opt-level = "s"
[profile.release.package.age-core]
opt-level = "s"
