[package]
name = "shadui-ripgrep"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The app; src/bin/shadui-index.rs is the instant search service bundled with it.
default-run = "shadui-ripgrep"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["index"]

# The app and the instant search service share one version: the app offers to update the service
# whenever the two differ, so every release bumps both (see docs/releasing.md).
[workspace.package]
version = "0.6.0"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shadui_ripgrep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8"
shadui-index = { path = "index" }
# The File X-Ray's checksums and the duplicate finder's content digests: RustCrypto's SHA-256 (with the
# CPU's SHA instructions where it has them) and crc32fast, both already in the build through Tauri and flate2.
sha2 = "0.10"
crc32fast = "1.5"
# Zip and 7z archives, read like folders. Both pure Rust: zip-rs (the maintained successor of the
# original zip crate, fuzzed) with every common method except Zstandard (C code) and encryption (no
# passwords yet), and sevenz-rust2 (the maintained fork of sevenz-rust, hardened against crafted headers).
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd", "legacy-zip"] }
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "ppmd", "deflate"] }

[dev-dependencies]
# Tests write their own 7z archives.
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["bzip2", "ppmd", "deflate", "compress"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Without the default `zip` feature: it only unpacks Tauri v1-style .zip updates, and updates here
# are the NSIS setup.exe itself.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# What windows' #[implement] expands to (the file engine's progress sink, for Undo); already in the build.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
