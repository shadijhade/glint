[package]
name = "shadui-ripgrep"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# The app; src/bin/shadui-index.rs is the instant search service bundled with it.
default-run = "shadui-ripgrep"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["index"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shadui_ripgrep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2.5"
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8"
shadui-index = { path = "index" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
