# cargo-about's list of the crates Glint is built from, with their licenses' texts:
# THIRD_PARTY_CRATES.md, written by `npm run licenses` with about.hbs (docs/releasing.md).

# The licenses deny.toml allows. A crate under a choice of them (MIT OR Apache-2.0) is listed under the
# first here, so the short, permissive ones come first.
accepted = [
    "MIT",
    "MIT-0",
    "0BSD",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "bzip2-1.0.6",
    "MPL-2.0",
]
# The one build that ships, and only what goes into it.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Glint's own crates (MIT, like the app).
private = { ignore = true }
