<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glint folder map</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: rgba(0,0,0,.08); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #e6edf3; --muted: #8b949e; --line: rgba(255,255,255,.08); } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px 6px; }
  header b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header span { color: var(--muted); white-space: nowrap; }
  #map { position: relative; height: 360px; margin: 0 12px 12px; border-radius: 8px; overflow: hidden; }
  .cell { position: absolute; box-sizing: border-box; border: 1px solid var(--bg); padding: 4px 6px; overflow: hidden; color: #fff; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .cell small { display: block; opacity: .85; }
  #empty { padding: 24px 12px; color: var(--muted); }
</style>
</head>
<body>
<header><b id="title">Glint</b><span id="total"></span></header>
<div id="map"></div>
<div id="empty">Waiting for Glint's answer…</div>
<script>
// Glint's folder map for MCP Apps: the answer of folder_sizes or largest_files (its structuredContent)
// as a treemap, biggest first. It reads only what the tool returned; nothing here fetches anything.
const COLORS = ["#d6336c", "#7048e8", "#1c7ed6", "#0ca678", "#f59f00", "#e8590c", "#ae3ec9", "#1098ad", "#74b816", "#f03e3e"];
const size = (n) => { const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`; };
function squarify(items, x, y, w, h, out) {
  if (!items.length) return;
  const total = items.reduce((s, it) => s + it.value, 0);
  if (items.length === 1 || w <= 0 || h <= 0) { out.push({ ...items[0], x, y, w, h }); return; }
  let row = [], rest = items.slice(), best = Infinity;
  const side = Math.min(w, h);
  while (rest.length) {
    const next = [...row, rest[0]];
    const sum = next.reduce((s, it) => s + it.value, 0);
    const area = (sum / total) * w * h;
    const length = area / side;
    const worst = Math.max(...next.map((it) => { const a = (it.value / total) * w * h; const r = (length * length) / a; return Math.max(r, 1 / r); }));
    if (worst > best) break;
    best = worst; row = next; rest.shift();
  }
  const sum = row.reduce((s, it) => s + it.value, 0);
  const thick = (sum / total) * (w >= h ? w : h);
  let at = 0;
  for (const it of row) {
    const part = (it.value / sum) * (w >= h ? h : w);
    out.push(w >= h ? { ...it, x, y: y + at, w: thick, h: part } : { ...it, x: x + at, y, w: part, h: thick });
    at += part;
  }
  if (w >= h) squarify(rest, x + thick, y, w - thick, h, out); else squarify(rest, x, y + thick, w, h - thick, out);
}
function render(data) {
  if (!data) return;
  const items = (data.folders ?? data.files ?? []).map((it, i) => ({ label: it.name ?? String(it.path).split("\\").pop(), detail: it.path ?? "", value: Number(it.size) || 0, color: COLORS[i % COLORS.length] })).filter((it) => it.value > 0).slice(0, 60);
  document.getElementById("title").textContent = data.folder ?? "Glint";
  document.getElementById("total").textContent = data.total ? size(data.total) : "";
  const map = document.getElementById("map");
  map.innerHTML = "";
  document.getElementById("empty").style.display = items.length ? "none" : "block";
  if (!items.length) { document.getElementById("empty").textContent = "Nothing to map."; return; }
  const cells = [];
  squarify(items.sort((a, b) => b.value - a.value), 0, 0, map.clientWidth, map.clientHeight, cells);
  for (const c of cells) {
    const el = document.createElement("div");
    el.className = "cell";
    Object.assign(el.style, { left: `${c.x}px`, top: `${c.y}px`, width: `${c.w}px`, height: `${c.h}px`, background: c.color });
    el.title = `${c.detail || c.label}\n${size(c.value)}`;
    if (c.w > 60 && c.h > 28) { el.textContent = c.label; const s = document.createElement("small"); s.textContent = size(c.value); el.appendChild(s); }
    map.appendChild(el);
  }
}
// The host tells the app the tool's result; the app says it's ready first.
let id = 0;
const send = (method, params) => window.parent.postMessage({ jsonrpc: "2.0", id: ++id, method, params }, "*");
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent ?? JSON.parse(m.params?.content?.[0]?.text ?? "null"));
});
send("ui/initialize", { appInfo: { name: "glint-folder-map", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
window.addEventListener("resize", () => {});
</script>
</body>
</html>
