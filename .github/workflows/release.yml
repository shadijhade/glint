name: Release

# Builds the GPUI Glint's release the way `npm run release` does (docs/releasing.md): the same scripts, split
# around the places SignPath needs to get in. Nothing here uses Tauri: cargo builds Glint.exe and the instant
# search service, scripts/gpui-installer.mjs packs them with NSIS, scripts/lib/minisign.mjs makes the update
# signature with Node's own crypto, and scripts/release.mjs --installer lays out latest.json and the rest.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Publishing a draft made by `npm run release` creates its tag too: that release is done already.
  made:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.find.outputs.released }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME was released with npm run release: nothing to build"
          fi

  release:
    needs: made
    if: needs.made.outputs.released != 'true'
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      # Only whether it's set: the key itself stays in the steps that sign.
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # The scripts' default too: one build folder for the whole job.
      CARGO_TARGET_DIR: ${{ github.workspace }}\target\ui
    steps:
      # Actions are pinned to commits: this job holds the signing secrets.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release scripts need Node and nothing from npm (they use Node's own modules), so no npm install.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/ui"

      # makensis packs the installer (scripts/gpui-installer.mjs finds it in Program Files (x86)\NSIS).
      - name: Install NSIS
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis --no-progress -y
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { throw "makensis.exe isn't where NSIS installs it" }

      - name: Check version consistency and run checks
        shell: pwsh
        run: |
          # Any failing command fails the step, not just the last one.
          $PSNativeCommandUseErrorActionPreference = $true
          # One version everywhere: the root Cargo.toml's [workspace.package] version, which Glint.exe, the
          # installer and the instant search service share (the app offers to update the service when the two
          # differ), package.json follows it, and a tag names it.
          $version = node -e "import('./scripts/lib/project.mjs').then((p) => console.log(p.workspaceVersion()))"
          $all = @((Get-Content package.json | ConvertFrom-Json).version) + (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.version
          if ($all | Where-Object { $_ -ne $version }) { throw "Versions differ from Cargo.toml ($version): $($all -join ', ')" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME doesn't match version $version" }
          # Without the updater key there's no latest.json, and installed copies couldn't update themselves.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:HAS_UPDATER_KEY -ne "true") { throw "Set the TAURI_SIGNING_PRIVATE_KEY secret: a release without latest.json can't be installed by the in-app updater" }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=Glint_${version}_x64-setup.exe" >> $env:GITHUB_ENV
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The crates that need no window; glint-ui's tests open GPUI windows and run on the maintainer's PC.
          cargo test -p glint-model -p glint-core -p shadui-index --locked

      - name: Build Glint.exe and the instant search service
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked -p glint -p shadui-index

      - name: Stage unsigned binaries for SignPath
        id: stage-unsigned
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\unsigned-binaries" -Force | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\Glint.exe" "$env:RUNNER_TEMP\unsigned-binaries\Glint.exe"
          Copy-Item "$env:CARGO_TARGET_DIR\release\shadui-index.exe" "$env:RUNNER_TEMP\unsigned-binaries\shadui-index.exe"
          Compress-Archive -Path "$env:RUNNER_TEMP\unsigned-binaries\*" -DestinationPath "$env:RUNNER_TEMP\glint-binaries.zip" -Force

      - name: Upload unsigned binaries artifact
        id: upload-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/glint-binaries.zip
          if-no-files-found: error

      - name: Sign inner binaries with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "glint"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "zip"
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-binaries

      # The installer is packed from the binaries as they are to be released (SignPath's when it signed them), with
      # the service's update signature made over exactly that service: an installed service updates itself to this
      # release with it (scripts/sign-service.mjs). rg, fd and pdu are the official ones from crates/glint/binaries.
      - name: Pack the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pack = "$env:RUNNER_TEMP\pack"
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          if ($env:HAS_SIGNPATH -eq "true") {
            Expand-Archive -Path "$env:RUNNER_TEMP\signed-binaries\glint-binaries.zip" -DestinationPath $pack -Force
            foreach ($f in @("$pack\Glint.exe", "$pack\shadui-index.exe")) {
              $sig = Get-AuthenticodeSignature $f
              Write-Host "$($sig.Status)  $(Split-Path $f -Leaf)  $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne "Valid") { throw "Invalid Authenticode signature on $f" }
            }
          } else {
            Copy-Item "$env:RUNNER_TEMP\unsigned-binaries\*" $pack
          }
          $serviceSig = @()
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            node scripts/sign-service.mjs "$pack\shadui-index.exe"
            $serviceSig = @("--service-sig", "$pack\shadui-index.exe.sig")
          }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\unsigned-installer" -Force | Out-Null
          node scripts/gpui-installer.mjs --no-build --exe "$pack\Glint.exe" --service "$pack\shadui-index.exe" @serviceSig --service-signed --out "$env:RUNNER_TEMP\unsigned-installer\$($env:INSTALLER_NAME)"

      - name: Upload unsigned NSIS installer artifact
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: ${{ runner.temp }}/unsigned-installer/${{ env.INSTALLER_NAME }}
          if-no-files-found: error

      - name: Sign NSIS installer with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "glint"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "exe"
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-installer

      # The update signature, latest.json (checked the way the app checks it) and the winget and Scoop manifests,
      # all from the installer that gets uploaded. Without the key (a try run, not a tag) the installer is only
      # copied under its two names and the manifests written.
      - name: Generate the update signature (.sig and latest.json) and package manifests
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $outDir = "release\v$($env:VERSION)"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          if ($env:HAS_SIGNPATH -eq "true") {
            $installer = "$env:RUNNER_TEMP\signed-installer\$($env:INSTALLER_NAME)"
            $sig = Get-AuthenticodeSignature $installer
            Write-Host "$($sig.Status)  $(Split-Path $installer -Leaf)  $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "Invalid Authenticode signature on $installer" }
          } else {
            $installer = "$env:RUNNER_TEMP\unsigned-installer\$($env:INSTALLER_NAME)"
          }

          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            # --installer: sign and lay out this setup program, none built here. The tree is the tag's commit.
            node scripts/release.mjs --installer $installer --out $outDir --allow-dirty
          } else {
            Copy-Item $installer "$outDir\$($env:INSTALLER_NAME)" -Force
            # The same installer without the version in its name: the Download links ask for the latest release's Glint-setup.exe.
            Copy-Item $installer "$outDir\Glint-setup.exe" -Force
            node scripts/package-manifests.mjs $env:VERSION "$outDir\$($env:INSTALLER_NAME)" --out "$outDir\package-manifests"
          }
          # What gets uploaded must be what SignPath signed.
          if ($env:HAS_SIGNPATH -eq "true" -and (Get-AuthenticodeSignature "$outDir\$($env:INSTALLER_NAME)").Status -ne "Valid") { throw "The installer to upload isn't validly signed" }

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-v${{ env.VERSION }}
          path: release/v${{ env.VERSION }}/
          if-no-files-found: error

      - name: Create draft GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # The files, not package-manifests/ (a folder); those stay in the run's artifact.
          $assets = Get-ChildItem "release\v$($env:VERSION)\*" -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "Glint v$($env:VERSION)" --generate-notes
