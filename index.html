<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glint</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var saved = localStorage.getItem("shadui-ripgrep-storage");
        // Settings from an earlier run: an update, not a fresh install (see greetUpdate).
        if (saved) document.documentElement.dataset.returning = "";
        var theme = JSON.parse(saved).state.settings.theme;
        if (theme !== "light" && (theme !== "system" || matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {
        // A first run: Windows' own light or dark (the default, System).
        if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
